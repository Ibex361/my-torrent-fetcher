name: Fetch Torrent and Send to Telegram

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: "Magnet link to download"
        required: true
        type: string
      action:
        description: "List files in the torrent first, or download directly?"
        required: false
        default: "download"
        type: choice
        options:
          - "download"
          - "list_files"
      client:
        description: "Which torrent client to use"
        required: false
        default: "peerflix"
        type: choice
        options:
          - "peerflix"
          - "qbittorrent"
          - "transmission"
      file_indices:
        description: "Only for qbittorrent: comma-separated file numbers to download (from list_files output), e.g. 0,2,5. Leave blank for all files."
        required: false
        default: ""
        type: string
      preview_only:
        description: "Preview only? (downloads ~10MB so you can check the file before full download)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      compress:
        description: "Compress video to x265 before sending? (smaller file, same visual quality, slower)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # just under the 6-hour hard limit
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (needed for peerflix)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install torrent clients and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg qbittorrent-nox transmission-cli transmission-daemon
          npm install -g peerflix

      - name: Install Python dependencies
        run: pip install telethon

      - name: Download torrent and send to Telegram
        env:
          MAGNET_LINK: ${{ github.event.inputs.magnet_link }}
          ACTION: ${{ github.event.inputs.action }}
          CLIENT: ${{ github.event.inputs.client }}
          FILE_INDICES: ${{ github.event.inputs.file_indices }}
          PREVIEW_ONLY: ${{ github.event.inputs.preview_only }}
          COMPRESS: ${{ github.event.inputs.compress }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_TARGET: "me"
        run: python fetch_and_send.py
