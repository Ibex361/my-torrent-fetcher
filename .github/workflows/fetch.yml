name: Fetch Torrent and Send to Telegram

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: "Magnet link to download"
        required: true
        type: string
      preview_only:
        description: "Preview only? (downloads ~10MB so you can check the file before full download)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      compress:
        description: "Compress video to x265 before sending? (smaller file, same visual quality, slower)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # just under the 6-hour hard limit
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install aria2 and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y aria2 ffmpeg

      - name: Diagnose UDP connectivity (troubleshooting step)
        run: |
          echo "Sending a real BitTorrent UDP tracker 'connect' packet (BEP 15 protocol)..."
          echo "A reply means UDP genuinely works end-to-end. No reply/timeout means it's being blocked or dropped somewhere on GitHub's network."
          python3 -c "
import socket, struct

s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
s.settimeout(6)

# BEP 15: UDP tracker protocol 'connect' request
# protocol_id (magic constant) + action=0 (connect) + random transaction_id
protocol_id = 0x41727101980
transaction_id = 12345
packet = struct.pack('>QII', protocol_id, 0, transaction_id)

try:
    s.sendto(packet, ('tracker.opentrackr.org', 1337))
    data, addr = s.recvfrom(1024)
    action, recv_txn, connection_id = struct.unpack('>IIQ', data[:16])
    if recv_txn == transaction_id and action == 0:
        print(f'SUCCESS: got a valid UDP tracker reply from {addr}. UDP works fine end-to-end.')
    else:
        print(f'Got a reply from {addr} but it did not match expected format — unusual but still means UDP round-tripped.')
except socket.timeout:
    print('TIMEOUT: no reply within 6 seconds. This strongly suggests outbound UDP is being blocked or silently dropped on this runner.')
except Exception as e:
    print(f'UDP socket error: {e}')
"
        continue-on-error: true

      - name: Install Python dependencies
        run: pip install telethon

      - name: Download torrent and send to Telegram
        env:
          MAGNET_LINK: ${{ github.event.inputs.magnet_link }}
          PREVIEW_ONLY: ${{ github.event.inputs.preview_only }}
          COMPRESS: ${{ github.event.inputs.compress }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_TARGET: "me"
        run: python fetch_and_send.py
